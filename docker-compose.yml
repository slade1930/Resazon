services:
  db:
    image: pgvector/pgvector:pg16
    container_name: resazon_db
    environment:
      POSTGRES_USER: resazon
      POSTGRES_PASSWORD: resazon
      POSTGRES_DB: resazon_loop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resazon -d resazon_loop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: